services:
  bracket-postgres:
    image: postgres@sha256:bffa6baeb307a531d731bf3ef9835dc396afaeddf81944337b8f990b2109ffca
    container_name: bracket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bracket_dev}
      POSTGRES_USER: ${POSTGRES_USER:-bracket_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - bracket_postgres_data:/var/lib/postgresql/data
#    networks:
#      - bjj-net
    networks:
      bjj-net:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: bjj-nginx
    depends_on:
      - bracket
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
#    networks:
#      - bjj-net
    networks:
      bjj-net:
        ipv4_address: 172.30.0.100
    restart: unless-stopped

  bracket:
    # P2.5C — digest release de 47bc129-r3 publicado en el registry y fijado aqui.
    # El contenedor solo se recrea al ejecutar `docker compose up -d` (P2.5D);
    # P2.5C no ejecuta Compose. Rollback: volver al digest productivo anterior
    #   sha256:e07ec8b49ad8274229422c40a87331b285785a0b80120bb3111d05bb911e8df8
    image: danyseve1/bracket-bjj@sha256:8e9f2ca217c45637f5ffbc0b69c43bd6862ec04cda6a1400a46c22438155e9e1
    container_name: bracket
#  bracket:
#    image: danyseve/bracket-bjj:0.1.0
#    container_name: bracket
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8400/api/ping | grep -q "\"ping\""']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - bracket-postgres
    ports:
      - "${BRACKET_PORT:-8400}:8400"
    environment:
      ENVIRONMENT: "PRODUCTION"
      PG_DSN: postgresql://${POSTGRES_USER:-bracket_dev}:${POSTGRES_PASSWORD:-change_me}@bracket-postgres:5432/${POSTGRES_DB:-bracket_dev}
      JWT_SECRET: ${JWT_SECRET:-change_me_please_generate_real_secret}
#      CORS_ORIGINS: "http://172.18.0.4:8400,http://10.0.0.67:8400,http://localhost:8400,http://bjj-bracket.local:8400"
      CORS_ORIGINS: "http://10.0.0.67:8400,http://10.0.0.67:8080,http://localhost:8400,http://bjj.local:8080,http://bjj.test:8080"
      SERVE_FRONTEND: "true"
      API_PREFIX: "/api"
      AUTO_RUN_MIGRATIONS: "false"
#    networks:
#      - bjj-net
    networks:
      bjj-net:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # P2.5C — release de Tatami 1 (Bridge + scoreboard) bajo el perfil "tatami1".
  # Imagenes publicadas en el registry y fijadas por digest (verificado en P2.5C).
  #
  # ATENCION (cambio de P2.5C): el digest del Bracket de arriba YA es el release,
  # asi que un `up -d` SIN perfil tambien recrea el Bracket — es el primer paso
  # deliberado de P2.5D. El release de Tatami 1 (Bridge + scoreboard) se enciende
  # con `--profile tatami1`, que es el unico comando que aplica (y que revierte)
  # el resto del release.
  #
  # Las cinco variables marcadas con :? son obligatorias: sin ellas el fichero NO
  # se renderiza (fail-fast pedido, en lugar de un valor por defecto silencioso).
  # P2.5C ya las ha anadido al `.env` productivo (tokens generados en el host).
  bridge-api:
    # P2.5C — imagen release publicada y fijada por digest (sin `build:`).
    image: danyseve1/bjj-bridge-api@sha256:6b6d5327118f98b2bed3fe5ac88ec0109216bf3d7f6f04942eeaaac8b1b437f6
    container_name: bjj-bridge-api
    profiles: ["tatami1"]
    depends_on:
      bracket:
        condition: service_healthy
      scoreboard-tatami-1:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      BRACKET_API_URL: ${BRACKET_API_URL:?obligatoria}
      SCOREBOARD_TATAMI_1_URL: ${SCOREBOARD_TATAMI_1_URL:?obligatoria}
      SCOREBOARD_INTERNAL_TOKEN: ${SCOREBOARD_INTERNAL_TOKEN:?obligatoria}
      BRACKET_RESULT_WRITE_ENABLED: ${BRACKET_RESULT_WRITE_ENABLED:?obligatoria}
      # Credenciales de escritura en Bracket: OPCIONALES a proposito. Con
      # WRITE=false el Bridge arranca sin ellas; con WRITE=true su ausencia falla
      # en cerrado (503 bracket_write_not_configured) sin escribir nada.
      BRACKET_WRITE_USERNAME: ${BRACKET_WRITE_USERNAME:-}
      BRACKET_WRITE_PASSWORD: ${BRACKET_WRITE_PASSWORD:-}
    # Sin `ports`: nadie necesita el Bridge desde el host en este release. El
    # acceso es exclusivamente interno por bjj-net (nginx sigue igual).
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-1:
    # P2.5C — imagen release (adapter con /health y persistencia) publicada y
    # fijada por digest (sin `build:`).
    image: danyseve1/bjj-scoreboard@sha256:6fe745874fffd1a83ede55c3716307e6829f2d51d6e385f8a4b5e3836b4c1c71
    container_name: scoreboard-tatami-1
    profiles: ["tatami1"]
    healthcheck:
      test: ['CMD', 'node', '-e', "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:3000,path:'/health',timeout:4000},res=>{res.resume();process.exit(res.statusCode>=200&&res.statusCode<400?0:1);});req.on('timeout',()=>{req.destroy();process.exit(1);});req.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      SCOREBOARD_MODE: integrated
      SCOREBOARD_INTERNAL_TOKEN: ${SCOREBOARD_INTERNAL_TOKEN:?obligatoria}
      SCOREBOARD_CONTROL_TOKEN: ${SCOREBOARD_CONTROL_TOKEN:?obligatoria}
      SCOREBOARD_STATE_FILE: /state/state.json
    # Persistencia del Tatami 1. El directorio del host lo crea el runbook de
    # P2.5C (NO se crea aqui) y debe pertenecer al uid del usuario del contenedor
    # (node, uid 1000): si no, /health responde 503 y el servicio refusa arrancar
    # antes que perder un resultado.
    volumes:
      - /home/ubuntu/data/bjj-tournament-platform/tatami-1:/state
    # Sin `ports`: solo red interna.
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-2:
    build:
      context: ./services/scoreboard
    container_name: scoreboard-tatami-2
    profiles: ["multitatami"]
    ports:
      - "${SCOREBOARD_TATAMI_2_PORT:-3002}:3000"
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-3:
    build:
      context: ./services/scoreboard
    container_name: scoreboard-tatami-3
    profiles: ["multitatami"]
    ports:
      - "${SCOREBOARD_TATAMI_3_PORT:-3003}:3000"
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-4:
    build:
      context: ./services/scoreboard
    container_name: scoreboard-tatami-4
    profiles: ["multitatami"]
    ports:
      - "${SCOREBOARD_TATAMI_4_PORT:-3004}:3000"
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-5:
    build:
      context: ./services/scoreboard
    container_name: scoreboard-tatami-5
    profiles: ["multitatami"]
    ports:
      - "${SCOREBOARD_TATAMI_5_PORT:-3005}:3000"
    networks:
      - bjj-net
    restart: unless-stopped

  scoreboard-tatami-6:
    build:
      context: ./services/scoreboard
    container_name: scoreboard-tatami-6
    profiles: ["multitatami"]
    ports:
      - "${SCOREBOARD_TATAMI_6_PORT:-3006}:3000"
    networks:
      - bjj-net
    restart: unless-stopped

  wireguard:
    image: ghcr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
      - TZ=${TZ:-Europe/Madrid}
      - SERVERURL=${WG_SERVER_URL}
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - PEERS=${WG_PEERS:-10}
      - PEERDNS=${WG_PEERDNS:-1.1.1.1}
      - INTERNAL_SUBNET=${WG_INTERNAL_SUBNET:-10.8.0.0}
      - ALLOWEDIPS=${WG_ALLOWEDIPS:-0.0.0.0/0}
      - PERSISTENTKEEPALIVE_PEERS=all
      - LOG_CONFS=true
    volumes:
      - ./data/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_SERVER_PORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
#    networks:
#      - bjj-net
    networks:
      bjj-net:
        ipv4_address: 172.30.0.2

volumes:
  bracket_postgres_data:

#networks:
#  bjj-net:
#    driver: bridge
networks:
  bjj-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
