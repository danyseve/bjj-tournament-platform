# Centro de documentacion OpsForge publicado en su propio hostname.
#
# Arquitectura OpsForge: un hostname por aplicacion publicable, sin usar el apex
# como reverse proxy.
#   Cloudflare -> docs.opsforge.cc -> Access/OTP -> tunnel opsforge-oracle
#   -> nginx (aqui) -> ficheros estaticos en /etc/nginx/conf.d/docs-site
#
# El frontal bjj-nginx monta nginx/conf.d (read-only): la salida del build se sirve
# directamente desde ahi, asi que desplegar no requiere recrear el contenedor que
# sirve Bracket y Tatami 1.
#
# No se toca bjj.conf (sigue siendo el default implicito al incluirse antes en orden
# alfabetico: bjj.conf < docs.conf < tatami1.conf) ni tatami1.conf.

server {
    listen 80;
    server_name docs.opsforge.cc;

    root /etc/nginx/conf.d/docs-site;
    index index.html;

    client_max_body_size 1m;

    # El centro es documentacion estatica: no expone nada interno ni APIs.
    location /internal/ {
        return 404;
    }

    # Estaticos del sitio.
    location ~* \.(?:css|js|svg|png|jpe?g|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # PDFs descargables (misma fuente Markdown que el HTML).
    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Disposition "inline";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
}
