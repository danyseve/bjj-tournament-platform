# Tatami 1 (scoreboard) publicado en su propio hostname.
#
# Arquitectura OpsForge: un hostname por aplicacion publicable.
#   Cloudflare -> tatami1.opsforge.cc -> Access/OTP -> tunnel opsforge-oracle
#   -> nginx (aqui) -> scoreboard-tatami-1:3000
#
# El scoreboard sirve rutas ABSOLUTAS desde la raiz (/css/, /js/, /images/,
# /manifest.json, /socket.io/), asi que NO se retira ningun prefijo: este server
# es la raiz del hostname.
#
# El server de BJJ (bjj.conf) no se toca y sigue siendo el default implicito
# (conf.d se incluye en orden alfabetico: bjj.conf < tatami1.conf), de modo que
# cualquier Host no reconocido sigue yendo a Bracket.

server {
    listen 80;
    server_name tatami1.opsforge.cc;

    # El scoreboard no recibe subidas: limite modesto.
    client_max_body_size 5m;

    # Socket.IO / WebSocket: upgrade real y sin buffering.
    location /socket.io/ {
        proxy_pass http://scoreboard-tatami-1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Resto del scoreboard (marcador, /control, /css/, /js/, /images/, manifest).
    location / {
        proxy_pass http://scoreboard-tatami-1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El resto de peticiones no son upgrades: no forzar Connection.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}
