# Bracket (aplicacion del torneo) publicado en su propio hostname.
#
# Arquitectura OpsForge: un hostname por aplicacion publicable.
#   Cloudflare -> bracket.opsforge.cc -> Access (OpsForge BJJ Bracket) -> tunnel
#   opsforge-oracle -> nginx (aqui) -> bracket:8400
#
# Sustituye el acceso "por defecto" que hasta P2.6A tenia bjjvetusta.opsforge.cc
# (bjj.conf no declaraba server_name propio: Bracket se servia por ser el primer
# server, o sea el default implicito). En P2.6B bjjvetusta pasa a ser el portal
# estatico y Bracket queda accesible SOLO por este hostname.
#
# La SPA sirve rutas absolutas desde la raiz (/assets/...), asi que no se retira
# prefijo alguno: este server es la raiz del hostname. Se mantiene /api/ hacia el
# backend, igual que en bjj.conf.

server {
    listen 80;
    server_name bracket.opsforge.cc;

    # El backend acepta subidas multimodales (importaciones): mismo limite que antes.
    client_max_body_size 50m;

    # Endurecimiento (P2.6C): cabeceras de riesgo bajo. Sin CSP todavia: la SPA
    # no se puede ejercitar sin sesion de Access y no se impone una politica a
    # ciegas (podria romper el arranque del bundle). Ver docs/11.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://bracket:8400;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://bracket:8400/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
