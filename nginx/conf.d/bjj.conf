# Portal operativo BJJ Vetusta / Asturkon (P2.6B).
#
# Arquitectura OpsForge: un hostname por aplicacion publicable.
#   Cloudflare -> bjjvetusta.opsforge.cc -> Access (BJJ Vetusta Manager) -> tunnel
#   opsforge-oracle -> nginx (aqui) -> ficheros estaticos de /portal
#
# ANTES (hasta P2.6A) este server hacia proxy a Bracket: no declaraba server_name
# propio y, por ser el PRIMER server de conf.d, recibia ademas cualquier Host no
# reconocido. Desde P2.6B:
#   - bjjvetusta.opsforge.cc sirve el PORTAL estatico;
#   - Bracket vive en su propio hostname (bracket.opsforge.cc, ver bracket.conf);
#   - este server sigue siendo el default implicito, asi que un Host desconocido
#     recibe el portal (pagina sin datos) y NUNCA la aplicacion del torneo.
#
# Rollback: restaurar la copia previa de bjj.conf
#   /home/ubuntu/backups/bjj-tournament-platform/nginx-<timestamp>/bjj.conf
# y `docker exec bjj-nginx nginx -s reload` (no hace falta recrear el contenedor).

server {
    listen 80;
    server_name bjjvetusta.opsforge.cc;

    root /etc/nginx/conf.d/portal;
    index index.html;

    # 404 real si falta un fichero: el portal no es una SPA.
    location / {
        try_files $uri $uri/ =404;
    }

    # Estaticos: cache corta (el portal se edita a mano durante el torneo).
    location ~* \.(?:css|js|json|svg|png|jpe?g|webp|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Ficheros ocultos fuera (salvo el reto ACME de /.well-known/).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # El portal no carga nada externo: CSP estricta y cabeceras basicas.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
